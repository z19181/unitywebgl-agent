<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:sans-serif; color:#fff; }
    #unity-container { width:100vw; height:100vh; position:absolute; top:0; left:0; }
    #unity-canvas { width:100%; height:100%; display:block; }
    #loading-cover {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:#{{{ BACKGROUND_COLOR || '231F20' }}};
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .logo { width:128px; height:128px; margin-bottom:24px; }
    .title { color:#fff; font-size:24px; font-weight:bold; margin-bottom:20px; text-align:center; }
    .bar-bg { width:200px; height:6px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; }
    .bar-fill { width:0%; height:100%; background:#7395ff; transition:width 0.3s; }
    .progress { margin-top:10px; font-size:12px; color:rgba(255,255,255,0.5); }

    /* PartyGame SDK 注入点 - 不要修改 */
    #pg-room-info { display:none; } /* screen.js 会控制显示 */
    #pg-players { display:none; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-cover">
    <div class="title">{{{ PRODUCT_NAME }}}</div>
    <div class="bar-bg"><div class="bar-fill" id="progress-bar"></div></div>
    <div class="progress" id="progress-text">Loading... 0%</div>
  </div>

  <!-- PartyGame SDK 脚本（由 screen/index.html 管理） -->
  <!-- 此模板仅提供 Unity 加载层，PartyGame 功能在 screen/index.html 中实现 -->

  <script>
    // Unity WebGL 标准加载脚本（PartyGame Template v0.2）
    // 此文件由 build 产出，不应手动修改
  </script>
</body>
</html>
