<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Party Game - Controller</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { 
      margin:0; 
      padding:0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      top:0;
      left:0;
      right:0;
      bottom:0;
    }
    
    /* ========= 顶部状态栏 ========= */
    #statusBar {
      background: rgba(0,0,0,0.3);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    #playerInfo {
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    
    #playerInfo.joined {
      display: flex;
    }
    
    #playerIndex {
      font-size: 18px;
      font-weight: bold;
      color: #51cf66;
    }
    
    #roomInfo {
      font-size: 12px;
      opacity: 0.8;
    }
    
    #scoreDisplay {
      font-size: 32px;
      font-weight: bold;
      color: #ffd43b;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    
    /* ========= 蓄力按钮 ========= */
    #chargeButton {
      flex: 1;
      margin: 20px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: radial-gradient(circle, #fff 0%, #e9ecef 100%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3), inset 0 2px 10px rgba(255,255,255,0.8);
      transition: all 0.1s ease;
      position: relative;
      overflow: hidden;
      /* 禁用移动端默认触摸行为 */
      touch-action: none;
    }
    
    #chargeButton:active, #chargeButton.charging {
      background: radial-gradient(circle, #51cf66 0%, #2f9e44 100%);
      transform: scale(0.95);
      box-shadow: 0 5px 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(255,255,255,0.3);
    }
    
    #buttonText {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      pointer-events: none;
    }
    
    #chargeButton:active #buttonText,
    #chargeButton.charging #buttonText {
      color: white;
    }
    
    /* ========= 能量条 ========= */
    #powerBarContainer {
      position: absolute;
      bottom: 0;
      left:0;
      right:0;
      height: 0%;
      background: linear-gradient(to top, #51cf66 0%, #ffd43b 70%, #ff6b6b 100%);
      transition: height 0.05s linear;
      pointer-events: none;
      opacity: 0.3;
    }
    
    /* ========= 日志面板 ========= */
    #logPanel {
      background: rgba(0,0,0,0.8);
      color: #51cf66;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 10px;
      height: 120px;
      overflow-y: auto;
      display: none; /* 默认隐藏，调试时可改为 block */
      flex-shrink: 0;
    }
    
    #logPanel.show {
      display: block;
    }
    
    .log-entry {
      margin-bottom: 2px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  
  <!-- 顶部状态栏 -->
  <div id="statusBar">
    <div id="playerInfo">
      <div id="playerIndex">玩家 X</div>
      <div id="roomInfo">房间 XXXXXX</div>
    </div>
    <div id="scoreDisplay">分数: 0</div>
  </div>
  
  <!-- 蓄力按钮 -->
  <div id="chargeButton">
    <div id="buttonText">按住蓄力<br>松开跳跃</div>
    <div id="powerBarContainer"></div>
  </div>
  
  <!-- 日志面板（调试用） -->
  <div id="logPanel"></div>
  
  <script>
    // ========================================
    // 配置
    // ========================================
    const CONFIG = {
      serverUrl: `ws://${window.location.host}`,
      chargeSpeed: 2,        // 能量条增长速度（% per frame）
      maxCharge: 100,         // 最大蓄力值
      enableDebugLog: true,   // 是否显示调试日志
    };
    
    // ========================================
    // 状态
    // ========================================
    let ws = null;
    let roomId = null;
    let playerIndex = null;
    let score = 0;
    let isCharging = false;
    let chargePower = 0;
    let chargeInterval = null;
    
    // DOM 元素
    const statusBarEl = document.getElementById('statusBar');
    const playerInfoEl = document.getElementById('playerInfo');
    const playerIndexEl = document.getElementById('playerIndex');
    const roomInfoEl = document.getElementById('roomInfo');
    const scoreDisplayEl = document.getElementById('scoreDisplay');
    const chargeButtonEl = document.getElementById('chargeButton');
    const buttonTextEl = document.getElementById('buttonText');
    const powerBarContainerEl = document.getElementById('powerBarContainer');
    const logPanelEl = document.getElementById('logPanel');
    
    // ========================================
    // 日志
    // ========================================
    function log(message) {
      if (!CONFIG.enableDebugLog) return;
      console.log(`[Controller] ${message}`);
      
      // 可选：显示在页面上
      if (logPanelEl.classList.contains('show')) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logPanelEl.appendChild(entry);
        logPanelEl.scrollTop = logPanelEl.scrollHeight;
      }
    }
    
    // ========================================
    // WebSocket 连接
    // ========================================
    function connectWebSocket() {
      log(`Connecting to ${CONFIG.serverUrl}...`);
      statusBarEl.textContent = '⚫ 正在连接服务器...';
      
      ws = new WebSocket(CONFIG.serverUrl);
      
      ws.onopen = () => {
        log('WebSocket connected');
        statusBarEl.textContent = '🟢 已连接，正在加入房间...';
        
        // 读取 roomId
        roomId = getRoomIdFromUrl();
        
        if (!roomId) {
          statusBarEl.textContent = '❌ 缺少 roomId，请在 URL 中添加 ?room=XXX';
          log('No roomId in URL');
          return;
        }
        
        // 发送 join_room
        joinRoom(roomId);
      };
      
      ws.onmessage = (event) => {
        handleMessage(event.data);
      };
      
      ws.onclose = () => {
        log('WebSocket disconnected');
        statusBarEl.textContent = '🔴 连接断开，正在重连...';
        
        // 重置状态
        playerIndex = null;
        playerInfoEl.classList.remove('joined');
        
        // 3秒后重连
        setTimeout(connectWebSocket, 3000);
      };
      
      ws.onerror = (error) => {
        log(`WebSocket error: ${error}`);
      };
    }
    
    // ========================================
    // 消息处理
    // ========================================
    function handleMessage(data) {
      try {
        const message = JSON.parse(data);
        const eventType = message.event || message.type;
        
        log(`Received: ${eventType}`);
        
        switch (eventType) {
          case 'room_joined':
            handleRoomJoined(message);
            break;
            
          case 'player_joined':  // 其他玩家加入
            log(`Player ${message.playerIndex} joined`);
            break;
            
          case 'player_left':
            log(`Player ${message.playerIndex} left`);
            break;
            
          case 'broadcast':
            // 日志埋点：收到 broadcast
            handleBroadcast(message);
            break;
            
          default:
            log(`Unknown message: ${eventType}`);
        }
        
      } catch (error) {
        log(`Error handling message: ${error.message}`);
      }
    }
    
    // ========================================
    // 广播消息处理（第 12 条要求）
    // ========================================
    function handleBroadcast(message) {
      log(`Received broadcast: ${message.type}`);
      
      // 验证：event 是否为 "broadcast"
      if (message.event !== 'broadcast') {
        log(`⚠ Invalid broadcast event: ${message.event}`);
        return;
      }
      
      // 验证：type 是否为 state.score_update
      if (message.type === 'state.score_update') {
        log(`[Controller] ✓ Valid broadcast: event=broadcast, type=state.score_update`);
        handleScoreUpdate(message.data);
      } else {
        log(`Unknown broadcast type: ${message.type}`);
      }
    }
    
    function handleScoreUpdate(data) {
      try {
        // 解析 scores（可能是 JSON 字符串或对象）
        let scores = {};
        if (typeof data === 'string') {
          scores = JSON.parse(data);
        } else if (data.scores) {
          scores = typeof data.scores === 'string' ? JSON.parse(data.scores) : data.scores;
        } else {
          scores = data;
        }
        
        // 兼容数字和字符串 key（用户建议的修复）
        const scoreValue = scores?.[playerIndex] ?? scores?.[String(playerIndex)] ?? 0;
        
        if (playerIndex !== null && scoreValue > 0) {
          log(`[Controller] Score updated: ${scoreValue}`);
          
          // 更新 UI
          score = scoreValue;
          scoreDisplayEl.textContent = `分数: ${score}`;
        } else {
          log(`[Controller] No score for playerIndex=${playerIndex} in scores`);
        }
        
      } catch (error) {
        log(`Error handling score update: ${error.message}`);
      }
    }
    
    // ========================================
    // 房间加入处理
    // ========================================
    function getRoomIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('room');
    }
    
    function joinRoom(roomIdToJoin) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('WebSocket not connected');
        return;
      }
      
      const message = {
        event: 'join_room',
        roomId: roomIdToJoin
      };
      
      // ⚠️ 第 7 条要求：不发送 playerIndex
      // playerIndex 由服务器分配
      
      ws.send(JSON.stringify(message));
      log(`Sent join_room: roomId=${roomIdToJoin} (NO playerIndex)`);
    }
    
    function handleRoomJoined(message) {
      // 确保 playerIndex 是数字（兼容字符串和数字）
      playerIndex = Number(message.playerIndex);
      roomId = message.roomId;
      
      // 显示 playerIndex
      playerIndexEl.textContent = `🎮 已加入房间！玩家 ${playerIndex}`;
      roomInfoEl.textContent = `房间 ${roomId}`;
      playerInfoEl.classList.add('joined');
      
      log(`Joined room ${roomId} as Player ${playerIndex}`);
      
      // 更新状态栏
      statusBarEl.innerHTML = `🎮 已加入房间！玩家 ${playerIndex}`;
    }
    
    // ========================================
    // 蓄力输入（第 5 条要求）
    // ========================================
    function startCharge() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('WebSocket not connected');
        return;
      }
      
      if (playerIndex === null) {
        log('Not joined yet');
        return;
      }
      
      isCharging = true;
      chargePower = 0;
      
      // 发送 input.charge_start（第 5 条要求）
      const message = {
        event: 'game_message',
        type: 'input.charge_start'
        // ⚠️ 不发送 playerIndex - 由服务器注入
      };
      
      ws.send(JSON.stringify(message));
      log('Sent input.charge_start (NO playerIndex)');
      
      // 开始蓄力动画
      chargeButtonEl.classList.add('charging');
      buttonTextEl.innerHTML = '蓄力中...<br>松开跳跃';
      
      // 能量条增长
      chargeInterval = setInterval(() => {
        chargePower = Math.min(chargePower + CONFIG.chargeSpeed, CONFIG.maxCharge);
        powerBarContainerEl.style.height = `${chargePower}%`;
      }, 16); // ~60fps
    }
    
    function endCharge() {
      if (!isCharging) return;
      
      isCharging = false;
      
      // 清除定时器
      if (chargeInterval) {
        clearInterval(chargeInterval);
        chargeInterval = null;
      }
      
      // 计算力量（0.0 ~ 1.0）
      const power = chargePower / CONFIG.maxCharge;
      
      // 发送 input.charge_end（第 5 条要求）
      const message = {
        event: 'game_message',
        type: 'input.charge_end',
        data: {
          power: power
        }
        // ⚠️ 不发送 playerIndex - 由服务器注入
      };
      
      ws.send(JSON.stringify(message));
      log(`Sent input.charge_end: power=${power.toFixed(2)} (NO playerIndex)`);
      
      // 重置 UI
      chargeButtonEl.classList.remove('charging');
      buttonTextEl.innerHTML = '按住蓄力<br>松开跳跃';
      powerBarContainerEl.style.height = '0%';
      chargePower = 0;
    }
    
    // ========================================
    // 触摸/鼠标事件
    // ========================================
    
    // 触摸事件（移动端）
    chargeButtonEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startCharge();
    }, { passive: false });
    
    chargeButtonEl.addEventListener('touchend', (e) => {
      e.preventDefault();
      endCharge();
    }, { passive: false });
    
    chargeButtonEl.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      endCharge();
    }, { passive: false });
    
    // 鼠标事件（桌面端测试用）
    chargeButtonEl.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startCharge();
    });
    
    chargeButtonEl.addEventListener('mouseup', (e) => {
      e.preventDefault();
      endCharge();
    });
    
    chargeButtonEl.addEventListener('mouseleave', (e) => {
      if (isCharging) {
        endCharge();
      }
    });
    
    // ========================================
    // 初始化
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      log('DOM loaded, checking URL...');
      
      // 检查 URL 中是否有 roomId
      const urlRoomId = getRoomIdFromUrl();
      if (!urlRoomId) {
        statusBarEl.innerHTML = '❌ 缺少 roomId<br>请在 URL 中添加 ?room=XXX';
        log('No roomId in URL');
        return;
      }
      
      log(`Found roomId in URL: ${urlRoomId}`);
      
      // 连接 WebSocket
      connectWebSocket();
    });
    
    // 页面关闭时清理
    window.addEventListener('beforeunload', () => {
      if (ws) ws.close();
    });
    
  </script>
</body>
</html>
