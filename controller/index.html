<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Party Game - Controller</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      width: 100vw; height: 100vh; width: 100dvw; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
      position: fixed; top:0; left:0; right:0; bottom:0;
    }

    /* 顶部状态栏 */
    #statusBar {
      background: rgba(0,0,0,0.3); padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; flex-shrink: 0;
    }
    #playerInfo { display:none; flex-direction:column; gap:4px; }
    #playerInfo.joined { display:flex; }
    #playerIndex { font-size:18px; font-weight:bold; color:#51cf66; }
    #roomInfo { font-size:12px; opacity:0.8; }
    #scoreDisplay { font-size:32px; font-weight:bold; color:#ffd43b; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

    /* 蓄力按钮 */
    #chargeButton {
      flex:1; margin:20px; border-radius:50%;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      cursor:pointer;
      background: radial-gradient(circle, #fff 0%, #e9ecef 100%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3), inset 0 2px 10px rgba(255,255,255,0.8);
      transition: all 0.1s ease; position:relative; overflow:hidden; touch-action:none;
    }
    #chargeButton:active, #chargeButton.charging {
      background: radial-gradient(circle, #51cf66 0%, #2f9e44 100%);
      transform: scale(0.95);
      box-shadow: 0 5px 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(255,255,255,0.3);
    }
    #buttonText { font-size:24px; font-weight:bold; color:#333; pointer-events:none; }
    #chargeButton:active #buttonText, #chargeButton.charging #buttonText { color:white; }

    /* 能量条 */
    #powerBarContainer {
      position:absolute; bottom:0; left:0; right:0; height:0%;
      background: linear-gradient(to top, #51cf66 0%, #ffd43b 70%, #ff6b6b 100%);
      transition: height 0.05s linear; pointer-events:none; opacity:0.3;
    }

    /* 重连覆盖层 */
    #reconnectOverlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.85); display:none;
      flex-direction:column; justify-content:center; align-items:center;
      color:white; z-index:3000; font-size:16px;
    }
    #reconnectOverlay.show { display:flex; }
    #reconnectOverlay .spinner {
      border:4px solid rgba(255,255,255,0.1); border-top:4px solid #51cf66;
      border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;
      margin-bottom:15px;
    }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* 房间销毁提示 */
    #destroyNotice {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.9); color:#ff6b6b; padding:20px 30px;
      border-radius:10px; font-size:18px; display:none; z-index:4000; text-align:center;
    }
    #destroyNotice.show { display:block; }
  </style>
</head>
<body>
  <div id="statusBar">
    <div id="playerInfo">
      <div id="playerIndex">玩家 X</div>
      <div id="roomInfo">房间 XXXXXX</div>
    </div>
    <div id="scoreDisplay">分数: 0</div>
  </div>

  <div id="chargeButton">
    <div id="buttonText">按住蓄力<br>松开跳跃</div>
    <div id="powerBarContainer"></div>
  </div>

  <div id="reconnectOverlay">
    <div class="spinner"></div>
    <div id="reconnectText">正在重连...</div>
  </div>

  <div id="destroyNotice">房间已关闭</div>

  <script>
    // ========================================
    // 配置
    // ========================================
    const CONFIG = {
      serverUrl: `ws://${window.location.host}`,
      chargeSpeed: 2,
      maxCharge: 100,
      enableDebugLog: true,
      reconnectMaxAttempts: 10,
      reconnectDelay: 2000,
    };

    // ========================================
    // 状态
    // ========================================
    let ws = null;
    let roomId = null;
    let playerIndex = null;
    let reconnectToken = null;
    let score = 0;
    let isCharging = false;
    let chargePower = 0;
    let chargeInterval = null;
    let reconnectAttempts = 0;
    let intentionalClose = false;
    let isJoined = false;

    // DOM
    const statusBarEl = document.getElementById('statusBar');
    const playerInfoEl = document.getElementById('playerInfo');
    const playerIndexEl = document.getElementById('playerIndex');
    const roomInfoEl = document.getElementById('roomInfo');
    const scoreDisplayEl = document.getElementById('scoreDisplay');
    const chargeButtonEl = document.getElementById('chargeButton');
    const buttonTextEl = document.getElementById('buttonText');
    const powerBarContainerEl = document.getElementById('powerBarContainer');
    const reconnectOverlay = document.getElementById('reconnectOverlay');
    const reconnectTextEl = document.getElementById('reconnectText');
    const destroyNotice = document.getElementById('destroyNotice');

    // ========================================
    // 日志
    // ========================================
    function log(msg) {
      if (!CONFIG.enableDebugLog) return;
      console.log(`[Controller] ${msg}`);
    }

    // ========================================
    // 持久化：localStorage 保存重连状态
    // ========================================
    function saveReconnectState() {
      if (!roomId || reconnectToken) return;
      localStorage.setItem('pg_reconnect', JSON.stringify({
        roomId,
        playerIndex,
        reconnectToken,
        playerName: `Player ${playerIndex}`,
        savedAt: Date.now(),
      }));
    }

    function loadReconnectState() {
      try {
        const saved = JSON.parse(localStorage.getItem('pg_reconnect'));
        if (saved && saved.reconnectToken && (Date.now() - saved.savedAt < 30000)) {
          return saved;
        }
      } catch (e) {}
      localStorage.removeItem('pg_reconnect');
      return null;
    }

    function clearReconnectState() {
      localStorage.removeItem('pg_reconnect');
    }

    // ========================================
    // WebSocket 连接
    // ========================================
    function connectWebSocket(opts = {}) {
      const { useToken } = opts;
      const saved = loadReconnectState();

      log(`Connecting to ${CONFIG.serverUrl}...`);

      ws = new WebSocket(CONFIG.serverUrl);

      ws.onopen = () => {
        log('WebSocket connected');
        reconnectAttempts = 0;
        reconnectOverlay.classList.remove('show');

        if (useToken && saved) {
          // 使用重连令牌
          reconnectTextEl.textContent = '正在恢复身份...';
          reconnectOverlay.classList.add('show');

          ws.send(JSON.stringify({
            event: 'rejoin_room',
            reconnectToken: saved.reconnectToken,
          }));
          log(`Sent rejoin_room with token`);
          clearReconnectState();
        } else if (roomId) {
          // 已知 roomId，正常加入
          ws.send(JSON.stringify({ event: 'join_room', roomId }));
          log(`Sent join_room: ${roomId}`);
        }
      };

      ws.onmessage = (event) => {
        handleMessage(event.data);
      };

      ws.onclose = () => {
        log('WebSocket disconnected');
        ws = null;

        if (intentionalClose) return;

        // 保存重连状态
        if (isJoined && reconnectToken) {
          saveReconnectState();
        }

        // 尝试重连
        if (reconnectAttempts < CONFIG.reconnectMaxAttempts) {
          reconnectAttempts++;
          reconnectTextEl.textContent = `连接断开，正在重连 (${reconnectAttempts}/${CONFIG.reconnectMaxAttempts})...`;
          reconnectOverlay.classList.add('show');
          setTimeout(() => {
            connectWebSocket({ useToken: true });
          }, CONFIG.reconnectDelay);
        } else {
          reconnectTextEl.textContent = '重连失败，请刷新页面';
          statusBarEl.textContent = '❌ 重连失败';
        }
      };

      ws.onerror = () => {
        log('WebSocket error');
      };
    }

    // ========================================
    // 消息处理
    // ========================================
    function handleMessage(data) {
      try {
        const message = JSON.parse(data);
        const eventType = message.event || message.type;
        log(`Received: ${eventType}`);

        switch (eventType) {
          case 'room_joined':
            handleRoomJoined(message);
            break;
          case 'player_joined':
            log(`Player ${message.playerIndex} joined`);
            break;
          case 'player_left':
            log(`Player ${message.playerIndex} left`);
            break;
          case 'broadcast':
            handleBroadcast(message);
            break;
          case 'room_destroy_countdown':
            log(`Room will be destroyed in ${message.seconds}s`);
            break;
          case 'room_destroyed':
            handleRoomDestroyed(message);
            break;
          case 'error':
            log(`Error: ${message.message}`);
            if (message.reason && message.reason.includes('token')) {
              // 令牌无效，降级为普通加入
              if (roomId) {
                ws.send(JSON.stringify({ event: 'join_room', roomId }));
              }
            }
            break;
          default:
            log(`Unknown: ${eventType}`);
        }
      } catch (error) {
        log(`Error handling message: ${error.message}`);
      }
    }

    // ========================================
    // 房间加入
    // ========================================
    function getRoomIdFromUrl() {
      return new URLSearchParams(window.location.search).get('room');
    }

    function handleRoomJoined(message) {
      playerIndex = Number(message.playerIndex);
      roomId = message.roomId;
      reconnectToken = message.reconnectToken;
      isJoined = true;
      score = 0; // 重置分数

      playerIndexEl.textContent = message.rejoined
        ? `🔄 已重新连接！玩家 ${playerIndex}`
        : `🎮 已加入房间！玩家 ${playerIndex}`;
      roomInfoEl.textContent = `房间 ${roomId}`;
      playerInfoEl.classList.add('joined');
      scoreDisplayEl.textContent = '分数: 0';
      reconnectOverlay.classList.remove('show');

      log(`Joined room ${roomId} as Player ${playerIndex}${message.rejoined ? ' (rejoined)' : ''}`);
      statusBarEl.innerHTML = `🎮 玩家 ${playerIndex}`;
    }

    function handleRoomDestroyed(message) {
      log(`Room destroyed: ${message.reason}`);
      isJoined = false;
      reconnectToken = null;
      clearReconnectState();
      intentionalClose = true;
      if (ws) ws.close();

      destroyNotice.querySelector || (destroyNotice.textContent = `房间已关闭\n${message.reason || ''}`);
      destroyNotice.textContent = `房间已关闭: ${message.reason || '未知原因'}`;
      destroyNotice.classList.add('show');
      statusBarEl.textContent = '❌ 房间已关闭';
    }

    // ========================================
    // 广播处理
    // ========================================
    function handleBroadcast(message) {
      if (message.event !== 'broadcast') return;

      if (message.type === 'state.score_update') {
        handleScoreUpdate(message.data);
      }
    }

    function handleScoreUpdate(data) {
      try {
        let scores = {};
        if (typeof data === 'string') {
          scores = JSON.parse(data);
        } else if (data && data.scores) {
          scores = typeof data.scores === 'string' ? JSON.parse(data.scores) : data.scores;
        } else if (data) {
          scores = data;
        }

        const scoreValue = scores?.[playerIndex] ?? scores?.[String(playerIndex)] ?? 0;

        if (playerIndex !== null) {
          log(`[Controller] Score updated: ${scoreValue}`);
          score = scoreValue;
          scoreDisplayEl.textContent = `分数: ${score}`;
        }
      } catch (error) {
        log(`Error handling score: ${error.message}`);
      }
    }

    // ========================================
    // 蓄力输入
    // ========================================
    function startCharge() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !isJoined) return;

      isCharging = true;
      chargePower = 0;

      ws.send(JSON.stringify({
        event: 'game_message',
        type: 'input.charge_start',
      }));

      chargeButtonEl.classList.add('charging');
      buttonTextEl.innerHTML = '蓄力中...<br>松开跳跃';

      chargeInterval = setInterval(() => {
        chargePower = Math.min(chargePower + CONFIG.chargeSpeed, CONFIG.maxCharge);
        powerBarContainerEl.style.height = `${chargePower}%`;
      }, 16);
    }

    function endCharge() {
      if (!isCharging) return;
      isCharging = false;

      if (chargeInterval) { clearInterval(chargeInterval); chargeInterval = null; }

      const power = chargePower / CONFIG.maxCharge;

      if (ws && ws.readyState === WebSocket.OPEN && isJoined) {
        ws.send(JSON.stringify({
          event: 'game_message',
          type: 'input.charge_end',
          data: { power },
        }));
      }

      chargeButtonEl.classList.remove('charging');
      buttonTextEl.innerHTML = '按住蓄力<br>松开跳跃';
      powerBarContainerEl.style.height = '0%';
      chargePower = 0;
    }

    // ========================================
    // 触摸/鼠标事件
    // ========================================
    chargeButtonEl.addEventListener('touchstart', e => { e.preventDefault(); startCharge(); }, { passive: false });
    chargeButtonEl.addEventListener('touchend', e => { e.preventDefault(); endCharge(); }, { passive: false });
    chargeButtonEl.addEventListener('touchcancel', e => { e.preventDefault(); endCharge(); }, { passive: false });
    chargeButtonEl.addEventListener('mousedown', e => { e.preventDefault(); startCharge(); });
    chargeButtonEl.addEventListener('mouseup', e => { e.preventDefault(); endCharge(); });
    chargeButtonEl.addEventListener('mouseleave', () => { if (isCharging) endCharge(); });

    // ========================================
    // 初始化
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      const urlRoomId = getRoomIdFromUrl();
      if (!urlRoomId) {
        statusBarEl.innerHTML = '❌ 缺少 roomId<br>请在 URL 中添加 ?room=XXX';
        return;
      }

      roomId = urlRoomId;
      log(`Found roomId in URL: ${urlRoomId}`);
      connectWebSocket();
    });

    window.addEventListener('beforeunload', () => {
      intentionalClose = true;
      if (ws) ws.close();
    });
  </script>
</body>
</html>
