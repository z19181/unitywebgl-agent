name: CI Debug
on:
  push:
    branches: [platform/v1.3.0-persistent-memory]
  workflow_dispatch:

jobs:
  debug-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Verbose secrets check
        run: |
          echo "=== git ls-files count ==="
          git ls-files | wc -l
          echo "=== Files containing sk- ==="
          git ls-files | xargs grep -l 'sk-' 2>/dev/null || echo "none"
          echo "=== Files matching FORBIDDEN patterns ==="
          git ls-files | while read f; do
            bn=$(basename "$f")
            if [[ "$bn" == ".env" ]] || [[ "$bn" == ".env.local" ]] || [[ "$bn" =~ ^\.env\..+\.local$ ]]; then
              echo "FORBIDDEN: $f"
            fi
          done
          echo "=== Running check-no-secrets verbose ==="
          node -e "
          const {execSync} = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const ROOT = process.cwd();
          const files = execSync('git ls-files', {encoding:'utf-8'}).trim().split('\\n').filter(f=>f);
          console.log('Total tracked files:', files.length);
          const filtered = files
            .filter(f => !f.includes('/test_') && !f.includes('/tests/') && !f.endsWith('.test.js') && !f.endsWith('.test.ts'))
            .filter(f => !f.endsWith('.md') && !f.endsWith('.mdx'))
            .filter(f => !f.startsWith('node_modules/'));
          console.log('After filter:', filtered.length);
          const patterns = [
            /\bsk-[A-Za-z0-9]{20,}\b/,
            /\bsk-ant-[A-Za-z0-9]{20,}\b/,
            /API_KEY\s*=\s*[\"']?[A-Za-z0-9_\-]{30,}/,
            /RAG_DATABASE_URL\s*=\s*postgres:\/\/[^\/]*:[^\/]+@[^\/]+\/[^\/]+/,
          ];
          let hits = 0;
          for (const f of filtered) {
            try {
              const c = fs.readFileSync(path.join(ROOT, f), 'utf-8');
              const lines = c.split('\\n');
              for (let i=0; i<lines.length; i++) {
                for (const p of patterns) {
                  if (p.test(lines[i])) {
                    console.log('HIT:', f+':'+(i+1), lines[i].trim().slice(0,120));
                    hits++;
                  }
                }
              }
            } catch(e) {}
          }
          console.log('Total hits:', hits);
          // Check .env.example
          for (const f of files) {
            if (f.endsWith('.env.example')) {
              const c = fs.readFileSync(path.join(ROOT, f), 'utf-8');
              if (c.includes('sk-')) {
                console.log('ENV_EXAMPLE_SK:', f);
                hits++;
              }
              // Check RAG_DATABASE_URL with password
              const m = c.match(/RAG_DATABASE_URL\s*=\s*postgres:\/\/[^\/]*:[^\/]+@[^\/]+\/[^\/]+/);
              if (m) {
                console.log('ENV_EXAMPLE_DB_URL:', f, m[0]);
                hits++;
              }
            }
          }
          if (hits > 0) { console.log('FAIL: secrets detected'); process.exit(1); }
          else console.log('PASS: no secrets');
          "
