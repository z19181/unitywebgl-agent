# v0.3.3 Monitoring Stack — Prometheus + Grafana + Redis + 2x PartyGame
#
# Start: docker-compose -f docker/docker-compose.monitoring.yml up -d
#
# Access:
#   PartyGame:     https://localhost/screen
#   Grafana:        http://localhost:3000 (admin/admin)
#   Prometheus:     http://localhost:9090
#   Health:         https://localhost/__health
#   Metrics:        https://localhost/__metrics

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s

  partygame-1:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment:
      - PORT=3000
      - STORE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - SERVER_HOST=localhost
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped

  partygame-2:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment:
      - PORT=3000
      - STORE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - SERVER_HOST=localhost
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: [partygame-1, partygame-2]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ['9090:9090']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ['3000:3000']
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/dashboards/partygame-sdk-overview.json:/etc/grafana/provisioning/dashboards/partygame-sdk-overview.json:ro
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
