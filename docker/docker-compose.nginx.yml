# v0.3.2 Production Deployment — Nginx + Redis + Multi-instance
#
# 4 services: nginx, redis, partygame-1, partygame-2
#
# Start:
#   1. Generate SSL certs: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout docker/nginx/ssl/key.pem -out docker/nginx/ssl/cert.pem -subj "/CN=localhost"
#   2. docker-compose -f docker/docker-compose.nginx.yml up -d
#
# Access:
#   Screen:      https://localhost/screen
#   Controller:  https://localhost/controller?room=XXXX
#   Health:      https://localhost/__health
#   Metrics:     https://localhost/__metrics
#
# Sticky session:
#   Screen redirects to /screen?roomId=ROOM_ID after room creation.
#   Nginx hash($arg_roomId$arg_room) routes same roomId to same instance.

version: '3.8'

services:
  # ── Redis ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
    volumes:
      - redis_data:/data

  # ── App instances (RedisStore) ──
  partygame-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - PORT=3000
      - STORE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - SERVER_HOST=${SERVER_HOST:-localhost}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  partygame-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - PORT=3000
      - STORE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - SERVER_HOST=${SERVER_HOST:-localhost}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (TLS termination + sticky routing) ──
  nginx:
    image: nginx:1.25-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - partygame-1
      - partygame-2
    restart: unless-stopped

volumes:
  redis_data:
