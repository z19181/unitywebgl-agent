# v0.3.3 Prometheus Configuration
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'partygame'
    metrics_path: '/__metrics'
    static_configs:
      - targets:
          - 'partygame-1:3000'
          - 'partygame-2:3000'
        labels:
          service: 'partygame'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # v1.3.0 Phase C.1 — Agent Memory Dashboard metrics
  - job_name: 'agent-memory-dashboard'
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
        labels:
          service: 'agent-memory-dashboard'
          env: 'production'
          version: 'v1.3.0'
    # Grace period to avoid scraping before server is ready
    scrape_timeout: 10s
