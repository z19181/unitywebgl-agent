# v0.3.3 Prometheus Configuration
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'partygame'
    metrics_path: '/__metrics'
    static_configs:
      - targets:
          - 'partygame-1:3000'
          - 'partygame-2:3000'
        labels:
          service: 'partygame'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
