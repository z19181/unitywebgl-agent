# v0.3.0 docker-compose.yml
version: '3.8'

services:
  partygame:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - SERVER_HOST=${SERVER_HOST:-localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/__health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 15s
      timeout: 3s
      retries: 3
