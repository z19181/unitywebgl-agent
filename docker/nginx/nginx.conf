# v0.3.2 Nginx Reverse Proxy Configuration
#
# Features:
#   - HTTP → HTTPS redirect
#   - WSS proxy (WebSocket Upgrade)
#   - Sticky session via roomId hash
#   - /__health exposed, /__metrics optionally protected
#
# Sticky strategy:
#   Nginx hashes on $arg_roomId (screen) and $arg_room (controller).
#   Both params carry the same room ID → routes to the same upstream.
#   Screen MUST redirect to /screen?roomId=ROOM_ID after room_created
#   (client-side redirect, no protocol change).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Sticky upstream: hash on roomId ──
    # $arg_roomId → screen URL (?roomId=ROOM)
    # $arg_room   → controller URL (?room=ROOM)
    # Both carry same room ID → same upstream
    upstream partygame_backend {
        hash $arg_roomId$arg_room consistent;
        server partygame-1:3000;
        server partygame-2:3000;
    }

    # ── HTTP → HTTPS redirect (for production) ──
    server {
        listen 80;
        server_name localhost;

        # Uncomment for production:
        # return 301 https://$host$request_uri;

        # For local dev: serve HTTP directly
        location / {
            proxy_pass http://partygame_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ── HTTPS (TLS termination) ──
    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL certificates (see ssl/README.md for generation)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Proxy to backend
        location / {
            proxy_pass http://partygame_backend;
            proxy_http_version 1.1;

            # WebSocket Upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Admin UI + API (v0.3.4)
        location /admin {
            proxy_pass http://partygame_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health endpoint — always exposed
        location /__health {
            proxy_pass http://partygame_backend/__health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Metrics endpoint — exposed (restrict in production)
        location /__metrics {
            # Uncomment to restrict to internal:
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://partygame_backend/__metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
