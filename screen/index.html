<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Party Game - Screen</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; width:100vw; height:100vh; overflow:hidden; font-family:Arial,sans-serif; color:white; }

    /* 房间信息 */
    #roomInfo {
      position:fixed; top:10px; left:10px;
      background:rgba(0,0,0,0.85); padding:15px; border-radius:10px;
      font-size:13px; z-index:1000; max-width:350px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #roomInfo h3 { margin-bottom:8px; color:#7395ff; }
    #roomId { font-size:28px; font-weight:bold; color:#51cf66; margin:8px 0; letter-spacing:3px; }
    #qrCode { margin:10px auto; display:flex; justify-content:center; }
    #qrCode img { border-radius:8px; background:#fff; padding:4px; }
    #controllerUrl {
      font-size:10px; word-break:break-all; color:#aaa;
      margin-top:8px; background:rgba(255,255,255,0.05); padding:6px; border-radius:5px;
    }
    .room-btn {
      background:#7395ff; color:white; border:none; padding:6px 12px;
      border-radius:5px; cursor:pointer; margin-top:6px; font-size:12px; margin-right:4px;
    }
    .room-btn:hover { background:#5a7de0; }
    .room-btn.danger { background:#ff6b6b; }
    .room-btn.danger:hover { background:#e05a5a; }

    /* 玩家列表 */
    #playerList {
      position:fixed; top:10px; right:10px;
      background:rgba(0,0,0,0.85); padding:15px; border-radius:10px;
      font-size:13px; z-index:1000; min-width:180px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #playerList h3 { margin-bottom:8px; color:#ff6b6b; }
    .player-item {
      padding:6px 8px; margin:3px 0;
      background:rgba(255,255,255,0.08); border-radius:6px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .player-item .score { color:#ffd43b; font-weight:bold; }
    .player-count { font-size:11px; color:#aaa; margin-top:6px; }

    /* 房间销毁倒计时 */
    #destroyCountdown {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.95); padding:30px 50px; border-radius:15px;
      text-align:center; z-index:5000; display:none;
      border: 2px solid #ff6b6b;
    }
    #destroyCountdown.show { display:block; }
    #destroyCountdown h2 { color:#ff6b6b; margin-bottom:10px; }
    #destroyCountdown .timer { font-size:48px; font-weight:bold; color:#ffd43b; }
    #cancelDestroyBtn {
      background:#51cf66; color:white; border:none; padding:10px 25px;
      border-radius:8px; cursor:pointer; font-size:14px; margin-top:15px;
    }

    /* Unity 容器 */
    #unityContainer { width:100%; height:100%; }
    #unityCanvas { width:100%; height:100%; display:block; }

    /* 加载遮罩 */
    #loadingOverlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.9); display:flex; flex-direction:column;
      justify-content:center; align-items:center; color:white; z-index:2000;
    }
    #loadingOverlay.hidden { display:none; }
    .spinner {
      border:4px solid rgba(255,255,255,0.1); border-top:4px solid #7395ff;
      border-radius:50%; width:50px; height:50px;
      animation:spin 1s linear infinite; margin-bottom:20px;
    }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* 状态栏 */
    #statusBar {
      position:fixed; bottom:10px; left:10px;
      background:rgba(0,0,0,0.6); padding:8px 15px;
      border-radius:5px; font-size:12px; z-index:1000;
    }

    /* screen 断线重连 */
    #screenReconnect {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.9); display:none;
      flex-direction:column; justify-content:center; align-items:center;
      z-index:6000;
    }
    #screenReconnect.show { display:flex; }
  </style>
</head>
<body>

  <!-- 房间信息 -->
  <div id="roomInfo">
    <h3>🎮 房间信息</h3>
    <div>房间 ID:</div>
    <div id="roomId">等待创建...</div>
    <div id="qrCode"></div>
    <div id="controllerUrl"></div>
    <div style="margin-top:8px;">
      <button class="room-btn" onclick="copyRoomUrl()">📋 复制链接</button>
      <button class="room-btn danger" onclick="destroyRoom()">💣 关闭房间</button>
    </div>
  </div>

  <!-- 玩家列表 -->
  <div id="playerList">
    <h3>👥 玩家 (<span id="playerCountText">0</span>/<span id="maxPlayersText">8</span>)</h3>
    <div id="players"><div style="opacity:0.5;">等待玩家加入...</div></div>
  </div>

  <!-- 房间销毁倒计时 -->
  <div id="destroyCountdown">
    <h2>⚠️ 房间即将关闭</h2>
    <div class="timer" id="destroyTimer">10</div>
    <div style="color:#aaa;margin-top:5px;">所有玩家将被移出</div>
    <button id="cancelDestroyBtn" onclick="cancelDestroy()">取消关闭</button>
  </div>

  <!-- Unity 容器 -->
  <div id="unityContainer">
    <canvas id="unityCanvas"></canvas>
  </div>

  <!-- 加载遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div>正在加载游戏...</div>
  </div>

  <!-- 状态栏 -->
  <div id="statusBar">正在连接服务器...</div>

  <!-- Screen 断线重连 -->
  <div id="screenReconnect">
    <div class="spinner"></div>
    <div style="margin-top:15px;">屏幕端连接断开，正在重连...</div>
  </div>

  <script>
    const CONFIG = {
      serverUrl: `ws://${window.location.host}`,
      unityBuildUrl: 'Build',
      unityLoaderUrl: 'Build/Build.loader.js',
      enableDebugLog: true,
    };

    let ws = null;
    let unityInstance = null;
    let currentRoomId = null;
    let players = [];
    let maxPlayers = 8;
    let destroyTimer = null;
    let screenReconnectAttempts = 0;

    const roomIdEl = document.getElementById('roomId');
    const qrCodeEl = document.getElementById('qrCode');
    const controllerUrlEl = document.getElementById('controllerUrl');
    const playersEl = document.getElementById('players');
    const statusBarEl = document.getElementById('statusBar');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const destroyCountdownEl = document.getElementById('destroyCountdown');
    const destroyTimerEl = document.getElementById('destroyTimer');
    const playerCountText = document.getElementById('playerCountText');
    const maxPlayersText = document.getElementById('maxPlayersText');
    const screenReconnectEl = document.getElementById('screenReconnect');

    function log(msg) {
      if (!CONFIG.enableDebugLog) return;
      console.log(`[Screen] ${msg}`);
      statusBarEl.textContent = msg;
    }

    function copyRoomUrl() {
      if (!currentRoomId) return;
      const url = `${window.location.origin}/controller?room=${currentRoomId}`;
      navigator.clipboard.writeText(url).then(() => {
        statusBarEl.textContent = '✅ 链接已复制！';
        setTimeout(() => { statusBarEl.textContent = ''; }, 2000);
      }).catch(() => {
        prompt('复制此链接：', url);
      });
    }

    // ========================================
    // 二维码
    // ========================================
    function loadQRCode(url) {
      // 使用 qrserver.com API 生成二维码
      const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=333333`;
      qrCodeEl.innerHTML = `<img src="${qrImgUrl}" width="180" height="180" alt="QR Code" onerror="this.parentElement.innerHTML='<div style=\\'color:#aaa\\'>二维码加载失败</div>'">`;
    }

    // ========================================
    // 房间销毁
    // ========================================
    function destroyRoom() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ event: 'destroy_room' }));
    }

    function cancelDestroy() {
      // Screen 重新连接即取消销毁（server 端逻辑）
      // 这里我们只需要重新发送 create_room 来保持房间
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      destroyCountdownEl.classList.remove('show');
      log('Room destroy cancelled');
    }

    // ========================================
    // WebSocket
    // ========================================
    function connectWebSocket() {
      log(`Connecting to ${CONFIG.serverUrl}...`);
      ws = new WebSocket(CONFIG.serverUrl);

      ws.onopen = () => {
        log('✅ Connected');
        screenReconnectEl.classList.remove('show');
        screenReconnectAttempts = 0;

        if (currentRoomId) {
          // 重连后重新创建房间（简化：新 roomId）
          // TODO: v0.3 screen 重连恢复 roomId
        }

        ws.send(JSON.stringify({ event: 'create_room' }));
        log('Sent: create_room');
      };

      ws.onmessage = (event) => handleMessage(event.data);

      ws.onclose = () => {
        log('❌ Disconnected');
        screenReconnectEl.classList.add('show');

        if (screenReconnectAttempts < 5) {
          screenReconnectAttempts++;
          setTimeout(connectWebSocket, 3000);
        } else {
          statusBarEl.textContent = '❌ 连接失败，请刷新页面';
        }
      };

      ws.onerror = () => {};
    }

    // ========================================
    // 消息处理
    // ========================================
    function handleMessage(data) {
      try {
        const message = JSON.parse(data);
        const eventType = message.event || message.type;
        log(`Received: ${eventType}`);

        switch (eventType) {
          case 'room_created':
            handleRoomCreated(message);
            break;
          case 'player_joined':
            handlePlayerJoined(message);
            break;
          case 'player_left':
            handlePlayerLeft(message);
            break;
          case 'room_destroy_countdown':
            handleDestroyCountdown(message);
            break;
          case 'room_destroyed':
            handleRoomDestroyed(message);
            break;
          case 'game_message':
            forwardToUnity(data);
            break;
          default:
            forwardToUnity(data);
        }
      } catch (error) {
        log(`Error: ${error.message}`);
      }
    }

    function handleRoomCreated(message) {
      currentRoomId = message.roomId;
      maxPlayers = message.maxPlayers || 8;

      roomIdEl.textContent = currentRoomId;

      const controllerUrl = `${window.location.origin}/controller?room=${currentRoomId}`;
      controllerUrlEl.textContent = controllerUrl;

      // 加载二维码
      loadQRCode(controllerUrl);

      maxPlayersText.textContent = maxPlayers;
      log(`Room created: ${currentRoomId} (max ${maxPlayers} players)`);
      loadUnity();
    }

    function handlePlayerJoined(message) {
      const { playerIndex, playerName, playerCount, rejoined } = message;

      if (!players.includes(playerIndex)) {
        players.push(playerIndex);
      }

      playerCountText.textContent = playerCount;
      renderPlayerList();
      log(`${rejoined ? 'Reconnected' : 'Joined'}: ${playerName} (total: ${playerCount})`);
    }

    function handlePlayerLeft(message) {
      const { playerIndex, playerCount } = message;
      players = players.filter(p => p !== playerIndex);
      playerCountText.textContent = playerCount;
      renderPlayerList();
      log(`Player ${playerIndex} left (total: ${playerCount})`);
    }

    function handleDestroyCountdown(message) {
      destroyCountdownEl.classList.add('show');
      destroyTimerEl.textContent = message.seconds;

      if (destroyTimer) clearInterval(destroyTimer);
      const startTime = Date.now();
      const totalMs = message.seconds * 1000;

      destroyTimer = setInterval(() => {
        const remaining = Math.max(0, totalMs - (Date.now() - startTime));
        destroyTimerEl.textContent = Math.ceil(remaining / 1000);
        if (remaining <= 0) clearInterval(destroyTimer);
      }, 100);
    }

    function handleRoomDestroyed(message) {
      destroyCountdownEl.classList.remove('show');
      if (destroyTimer) clearInterval(destroyTimer);

      currentRoomId = null;
      players = [];
      renderPlayerList();
      roomIdEl.textContent = '已关闭';
      qrCodeEl.innerHTML = '';
      log(`Room destroyed: ${message.reason}`);

      // 3秒后自动重新创建
      setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ event: 'create_room' }));
          log('Auto-recreating room...');
        }
      }, 3000);
    }

    function renderPlayerList() {
      if (players.length === 0) {
        playersEl.innerHTML = '<div style="opacity:0.5;">等待玩家加入...</div>';
        return;
      }
      const colors = ['#ff6b6b','#51cf66','#339af0','#ffd43b','#cc5de8','#ff922b','#20c997','#f06595'];
      let html = '';
      players.forEach((p, i) => {
        const color = colors[p % colors.length];
        html += `<div class="player-item" style="border-left:3px solid ${color}">
          <span>🎮 ${'P' + p}</span>
          <span class="score" id="score-${p}">0</span>
        </div>`;
      });
      playersEl.innerHTML = html;
    }

    // ========================================
    // 转发到 Unity
    // ========================================
    function forwardToUnity(jsonMessage) {
      if (!unityInstance) return;
      try {
        unityInstance.SendMessage('PartyGameBridge', 'OnMessageReceived', jsonMessage);
      } catch (e) {
        log(`Forward error: ${e.message}`);
      }
    }

    // ========================================
    // Unity 加载
    // ========================================
    function loadUnity() {
      log('Loading Unity WebGL...');
      const script = document.createElement('script');
      script.src = CONFIG.unityLoaderUrl;
      script.onload = () => {
        log('Unity loader loaded');
        const config = {
          dataUrl: `${CONFIG.unityBuildUrl}/Build.data`,
          frameworkUrl: `${CONFIG.unityBuildUrl}/Build.framework.js`,
          codeUrl: `${CONFIG.unityBuildUrl}/Build.wasm`,
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'PartyGame',
          productName: 'Jump Demo',
          productVersion: '2.0.0',
        };
        createUnityInstance(document.querySelector('#unityCanvas'), config, (progress) => {
          log(`Unity: ${(progress * 100).toFixed(1)}%`);
        }).then((instance) => {
          log('✅ Unity ready');
          unityInstance = instance;
          window.unityInstance = instance;
          loadingOverlay.classList.add('hidden');
        }).catch((e) => {
          log(`Unity failed: ${e.message}`);
          loadingOverlay.innerHTML = `<div style="text-align:center"><h3>⚠️ Unity 加载失败</h3><p style="margin-top:10px;color:#aaa;font-size:12px;">${e.message}</p><p style="margin-top:10px;color:#aaa;font-size:12px;">请先构建 Unity WebGL 项目到 screen/Build/</p><p style="margin-top:15px;"><button class="room-btn" onclick="document.getElementById('loadingOverlay').classList.add('hidden')">继续（无 Unity）</button></p></div>`;
        });
      };
      script.onerror = () => {
        log('Unity loader not found');
        loadingOverlay.innerHTML = `<div style="text-align:center"><h3>🎮 无 Unity 构建</h3><p style="margin-top:10px;color:#aaa;font-size:12px;">纯 Web 模式运行（无 Unity 游戏画面）</p><p style="margin-top:15px;"><button class="room-btn" onclick="document.getElementById('loadingOverlay').classList.add('hidden')">继续</button></p></div>`;
      };
      document.body.appendChild(script);
    }

    // ========================================
    // 全局函数（供 Unity jslib 调用）
    // ========================================
    window.PartyGameSendToServer = function(jsonMessage) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(jsonMessage);
    };

    window.PartyGameBroadcast = function(jsonMessage) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        const message = JSON.parse(jsonMessage);
        log(`Broadcast: ${message.type}`);
      } catch (e) {}
      ws.send(jsonMessage);
    };

    // ========================================
    // 初始化
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      log('Starting...');
      connectWebSocket();
    });

    window.addEventListener('beforeunload', () => {
      if (ws) ws.close();
      if (unityInstance) unityInstance.Quit();
    });
  </script>
</body>
</html>
