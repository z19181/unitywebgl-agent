<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PartyGameSDK — Unity WebGL</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <!-- PartyGameSDK UI Styles -->
  <style>
    :root {
      --pg-bg: rgba(0,0,0,0.85);
      --pg-text: #fff;
      --pg-accent: #51cf66;
      --pg-warn: #ffd43b;
      --pg-radius: 10px;
    }

    #pg-overlay {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
      background: var(--pg-bg);
      color: var(--pg-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      pointer-events: auto;
      border-radius: 0 0 var(--pg-radius) var(--pg-radius);
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
      transition: opacity 0.3s;
    }

    #pg-overlay.collapsed {
      opacity: 0.3;
    }

    #pg-overlay.collapsed:hover {
      opacity: 1;
    }

    .pg-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px;
    }

    #pg-status {
      font-weight: bold; font-size: 13px;
    }

    #pg-roomId {
      font-family: monospace; font-size: 16px; font-weight: bold;
      color: var(--pg-accent);
    }

    #pg-players {
      display: flex; flex-wrap: wrap; gap: 4px;
    }

    .pg-player-badge {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px; border-radius: 12px;
      font-size: 12px;
    }

    #pg-qrcode {
      width: 120px; height: 120px;
      background: white; border-radius: 8px;
      padding: 4px; flex-shrink: 0;
    }

    #pg-joinUrl {
      font-size: 11px; opacity: 0.7; word-break: break-all;
    }

    .pg-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white; padding: 6px 14px; border-radius: 6px;
      cursor: pointer; font-size: 12px;
    }

    .pg-btn:hover { background: rgba(255,255,255,0.25); }
    .pg-btn.danger:hover { background: rgba(255,100,100,0.4); border-color: #ff6b6b; }

    /* Unity canvas fills the viewport */
    #unity-container { width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; background: #231F20; }
    #unity-loading-bar { position: absolute; bottom: 50%; left: 50%; transform: translate(-50%,50%); display: flex; flex-direction: column; align-items: center; }
    #unity-progress-bar-empty { width: 141px; height: 18px; background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center; }
    #unity-progress-bar-full  { width: 0%; height: 18px; background: url('TemplateData/progress-bar-full-dark.png') no-repeat center; }

    body { margin: 0; padding: 0; overflow: hidden; background: #231F20; }
  </style>
</head>
<body>
  <!-- PartyGameSDK Overlay -->
  <div id="pg-overlay" class="collapsed">
    <div class="pg-row">
      <span id="pg-status">🟡 Initializing...</span>
      <span id="pg-roomId"></span>
      <button class="pg-btn danger" onclick="PartyGameCloseRoom()">✕ Close Room</button>
    </div>
    <div class="pg-row" style="align-items:flex-start;">
      <div style="flex:1;">
        <div id="pg-players">Waiting for players...</div>
        <div id="pg-joinUrl" style="margin-top:4px;"></div>
      </div>
      <div id="pg-qrcode"></div>
    </div>
  </div>

  <!-- Unity Container -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-footer"></div>
  </div>

  <!-- Unity Loader (standard) -->
  <script src="Build/Build_2048.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build_2048.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build_2048.data",
      frameworkUrl: buildUrl + "/Build_2048.framework.js",
      codeUrl: buildUrl + "/Build_2048.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "PartyGameSDK",
      productName: "2048",
      productVersion: "1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");


    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        window.unityInstance = unityInstance;

        console.log("[PartyGame] Unity instance ready");

        // ★ Initialize PartyGameSDK
        PartyGameInit({ maxPlayers: 4 });

      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>

  <!-- PartyGameSDK Initialization Script -->
  <script src="partygame-template.js"></script>
</body>
</html>
